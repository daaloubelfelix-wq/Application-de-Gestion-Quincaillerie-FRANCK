; Modèle de configuration — copier ce fichier en "config.ini" (même dossier)
; puis renseigner les vraies valeurs du serveur PostgreSQL.
; "config.ini" ne doit JAMAIS être partagé ou envoyé sur GitHub (voir .gitignore).

[database]
host = 192.168.1.10
port = 5432
dbname = quincaillerie_franck
user = quincaillerie_user
password = changer_ce_mot_de_passe

; Utilisé uniquement par l'API mobile (api/), pour signer les sessions du
; responsable. Générer une vraie valeur avec :
;   python -c "import secrets; print(secrets.token_hex(32))"
; et la coller ci-dessous — ne jamais garder la valeur d'exemple.
[api]
secret_key = a_remplacer_par_une_vraie_cle_generee_aleatoirement
duree_session_heures = 12
